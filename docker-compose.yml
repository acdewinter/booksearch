# For running outside Coolify:  docker compose up -d --build
# (Coolify builds from the Dockerfile directly; see DEPLOYMENT.md.)
services:
  shelfmark:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Leave empty for no sign-in, or set a password to protect the whole app.
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_USERNAME: ${APP_USERNAME:-}
      # Sign in with Hardcover and show your library; see .env.example.
      HARDCOVER_CLIENT_ID: ${HARDCOVER_CLIENT_ID:-}
      HARDCOVER_CLIENT_SECRET: ${HARDCOVER_CLIENT_SECRET:-}
      HARDCOVER_ALLOWED_USERS: ${HARDCOVER_ALLOWED_USERS:-}
      APP_URL: ${APP_URL:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
      # Only for senders behind a firewall; also publish the same ports below.
      DCC_PORTS: ${DCC_PORTS:-}
      DCC_PUBLIC_IP: ${DCC_PUBLIC_IP:-}
    volumes:
      - shelfmark-data:/data
      # Where downloaded files end up. Point the left side at your own folder;
      # it must be writable by user id 1000.
      - ${DOWNLOAD_PATH:-./downloads}:/downloads

volumes:
  shelfmark-data:
